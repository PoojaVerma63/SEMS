<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh; background: #f4f6f9;">
  <div class="card shadow p-4" style="width: 380px;">
    <h3 class="text-center mb-4">SEMS Sign Up</h3>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" formControlName="fullName" class="form-control" placeholder="Enter full name" />
        <div class="text-danger small" *ngIf="signupForm.get('fullName')?.touched && signupForm.get('fullName')?.invalid">
          Full name is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" formControlName="email" class="form-control" placeholder="Enter email" />
        <div class="text-danger small" *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid">
          Valid email is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" formControlName="password" class="form-control" placeholder="Enter password" />
        <div class="text-danger small" *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid">
          Password must be at least 6 characters
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100" [disabled]="loading">
        {{ loading ? 'Registering...' : 'Sign Up' }}
      </button>

      <p class="text-center mt-3">
        Already have an account? <a routerLink="/login">Login</a>
      </p>
    </form>
  </div>
</div>
